name: Emergency endpoint monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MONITOR_URL: ${{ secrets.OPINACRAFT_MONITOR_URL }}
      CRON_MONITOR_SECRET: ${{ secrets.OPINACRAFT_CRON_MONITOR_SECRET }}
    steps:
      - name: Run monitor over HTTP
        shell: bash
        run: |
          test -n "$MONITOR_URL"
          test -n "$CRON_MONITOR_SECRET"
          if [[ "${MONITOR_URL,,}" != https://* ]]; then
            echo "MONITOR_URL must use HTTPS"
            exit 1
          fi
          HTTP_STATUS=$(curl --silent --max-time 240 --output /dev/null --write-out "%{http_code}" \
            --proto '=https' --proto-redir '=https' \
            -X POST "$MONITOR_URL/api/internal/monitor/run" \
            -H "Authorization: Bearer $CRON_MONITOR_SECRET")
          case "$HTTP_STATUS" in
            2*) ;;
            *) echo "Monitor endpoint returned HTTP $HTTP_STATUS"; exit 1 ;;
          esac
