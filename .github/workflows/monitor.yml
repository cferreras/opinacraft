name: Endpoint monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod
      - name: Run endpoint monitor
        env:
          MONITOR_URL: ${{ secrets.OPINACRAFT_MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.OPINACRAFT_MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_URL"
          test -n "$MONITOR_SECRET"
          RESPONSE=$(curl --fail-with-body --max-time 240 -sS -X POST "$MONITOR_URL/api/internal/monitor/run" \
            -H "Authorization: Bearer $MONITOR_SECRET")
          MONITOR_RUN_JSON="$RESPONSE" node scripts/monitor-bedrock.mjs
