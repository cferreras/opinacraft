name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: opinacraft_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d opinacraft_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/opinacraft_ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/opinacraft_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      SERVER_VERIFICATION_SECRET: ci-only-verification-secret-at-least-32-chars

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to empty PostgreSQL
        run: pnpm db:migrate

      - name: Verify migrations are idempotent
        run: |
          psql "$DIRECT_DATABASE_URL" --set=ON_ERROR_STOP=1 --command 'DROP SCHEMA public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS drizzle CASCADE;'
          pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Unit and validation tests
        run: pnpm test

      - name: Build
        run: pnpm build
