name: Production database migration

run-name: Production database migration by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type migrate-production to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Confirm production migration
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "migrate-production"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate direct database connection
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const rawUrl = process.env.DIRECT_DATABASE_URL;
          if (!rawUrl) throw new Error("The production environment secret DIRECT_DATABASE_URL is required.");

          const url = new URL(rawUrl);
          if (!["postgres:", "postgresql:"].includes(url.protocol)) {
            throw new Error("DIRECT_DATABASE_URL must use the postgres or postgresql protocol.");
          }
          if (/-pooler(?:\.|$)/i.test(url.hostname)) {
            throw new Error("DIRECT_DATABASE_URL must be a direct, non-pooled connection.");
          }

          console.log(`Validated migration target: ${url.hostname}${url.pathname}`);
          NODE

      - name: Apply production migrations
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Inspect migrated database
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm db:inspect
