<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Tres propuestas de logo para OpinaCraft</title>
  <desc id="desc">Comparativa de tres marcas basadas en un cubo isométrico abierto.</desc>
  <rect width="1200" height="500" rx="28" fill="#F7F8FA" />
  <text x="48" y="58" fill="#141B23" font-family="Arial, sans-serif" font-size="24" font-weight="700">Tres direcciones de logo</text>
  <text x="48" y="88" fill="#687383" font-family="Arial, sans-serif" font-size="15">Basadas en tu boceto del cubo abierto · marcas SVG editables</text>

  <g transform="translate(48 126)">
    <rect width="330" height="318" rx="18" fill="#FFFFFF" stroke="#E1E6EB" />
    <g transform="translate(101 35) scale(1)" stroke="#2D2DE4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M64 10 111 38v52l-47 28-47-28V38L64 10Z" />
      <path d="M64 32 92 49v31L64 97 36 80V49L64 32Z" />
      <path d="M64 10v22M111 38 92 49M111 90 92 80M64 118V97M17 90l19-10M17 38l19 11" />
    </g>
    <text x="24" y="230" fill="#141B23" font-family="Arial, sans-serif" font-size="20" font-weight="700">01 · Wireframe</text>
    <text x="24" y="258" fill="#687383" font-family="Arial, sans-serif" font-size="14">La más fiel al dibujo original.</text>
    <text x="24" y="282" fill="#687383" font-family="Arial, sans-serif" font-size="14">Ligera, técnica y abierta.</text>
  </g>

  <g transform="translate(435 126)">
    <rect width="330" height="318" rx="18" fill="#FFFFFF" stroke="#E1E6EB" />
    <g transform="translate(101 35)" stroke-linejoin="round">
      <path d="M64 10 111 38 92 49 64 32 36 49 17 38Z" fill="#6673F2" />
      <path d="M17 38 36 49v31l28 17v21L17 90Z" fill="#202BC8" />
      <path d="M111 38 92 49v31l-28 17v21l47-28Z" fill="#4C5BE9" />
      <path d="M64 10 111 38v52l-47 28-47-28V38L64 10Z" fill="none" stroke="#141B23" stroke-width="3" />
      <path d="M64 32 92 49v31L64 97 36 80V49L64 32Z" fill="none" stroke="#141B23" stroke-width="3" />
    </g>
    <text x="24" y="230" fill="#141B23" font-family="Arial, sans-serif" font-size="20" font-weight="700">02 · Faceted</text>
    <text x="24" y="258" fill="#687383" font-family="Arial, sans-serif" font-size="14">Más reconocible a primera vista.</text>
    <text x="24" y="282" fill="#687383" font-family="Arial, sans-serif" font-size="14">Tiene volumen y más presencia.</text>
  </g>

  <g transform="translate(822 126)">
    <rect width="330" height="318" rx="18" fill="#FFFFFF" stroke="#E1E6EB" />
    <g transform="translate(101 35)">
      <path fill="#141B23" fill-rule="evenodd" d="M64 8 112 36v56l-48 28-48-28V36L64 8ZM64 27 94 44v38L64 100 34 82V44l30-17Z" />
      <path d="M64 8 112 36v56l-48 28-48-28V36L64 8Z" fill="none" stroke="#2D2DE4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M64 27 94 44v38L64 100 34 82V44l30-17Z" fill="none" stroke="#2D2DE4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M64 27v73" stroke="#2D2DE4" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="24" y="230" fill="#141B23" font-family="Arial, sans-serif" font-size="20" font-weight="700">03 · Solid</text>
    <text x="24" y="258" fill="#687383" font-family="Arial, sans-serif" font-size="14">La más fuerte para favicon.</text>
    <text x="24" y="282" fill="#687383" font-family="Arial, sans-serif" font-size="14">Compacta, contrastada y memorable.</text>
  </g>
</svg>
